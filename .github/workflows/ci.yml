name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Storybook test · Build · E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 package.json의 packageManager를 따름
      - uses: pnpm/action-setup@v6.1.0

      # Node 버전은 .nvmrc를 따름 (Docker 이미지와 같은 Node 22)
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # 모든 스토리를 실제 브라우저(Chromium)에서 렌더링하고 접근성 검사(axe)까지 실행
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:storybook
      # 데모 모드(기본값)로 빌드하므로 API 주소 환경 변수는 필요 없음
      - run: pnpm build
      # 프로덕션 빌드를 실행해 화면 폭별 잘림·넘침, 실제 화면 접근성, Storybook 전환 흐름을 검사
      - run: pnpm test:e2e
      # 실패하면 스크린샷·기록을 내려받아 확인
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker image (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Dockerfile이 .env.production을 복사하므로 빈 파일을 만듦 (데모 모드는 환경 변수 없이 동작)
      - run: touch .env.production

      - name: Build image
        run: docker build -f docker/production/Dockerfile -t ers:ci .

      - name: Run container and check response
        run: |
          docker run -d --name ers -p 3000:3000 ers:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/; then
              echo "Container is serving on port 3000"
              # Storybook(public/storybook)이 이미지에 함께 들어갔는지 확인
              curl -fsS -o /dev/null http://localhost:3000/storybook/index.html
              echo "Storybook is served at /storybook"
              exit 0
            fi
            sleep 2
          done
          docker logs ers
          exit 1
