<link rel="icon" href="./favicon.svg" />
<!--
  로그인 화면의 "Storybook 바로 가기"로 들어온 경우, 전환 화면(남색)이 가운데로 오므라들며 Storybook이 드러나는 도착 애니메이션.
  앱의 src/components/login/StorybookLink.tsx가 sessionStorage에 남긴 표시로 판단합니다. (같은 주소에 배포되어 sessionStorage 공유)
-->
<script>
  (function () {
    try {
      var key = "ers-storybook-transition";
      var startedAt = Number(sessionStorage.getItem(key));
      sessionStorage.removeItem(key);
      var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (startedAt && Date.now() - startedAt < 15000 && !reduced) {
        document.documentElement.classList.add("ers-arrive");
        setTimeout(function () {
          document.documentElement.classList.remove("ers-arrive");
        }, 1600);
      }
    } catch (e) {
      // 저장소를 쓸 수 없으면 애니메이션 없이 표시
    }
  })();
</script>
<style>
  html.ers-arrive::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    pointer-events: none;
    background: linear-gradient(135deg, #113662 0%, #15448b 55%, #0b56a7 100%);
    clip-path: circle(150vmax at 50% 50%);
    animation: ers-arrive 0.9s cubic-bezier(0.7, 0, 0.2, 1) 0.35s forwards;
  }

  html.ers-arrive::before {
    content: "";
    position: fixed;
    left: 50%;
    top: 50%;
    width: 72px;
    height: 72px;
    margin: -36px 0 0 -36px;
    z-index: 2147483647;
    pointer-events: none;
    background: url("./favicon.svg") center / contain no-repeat;
    animation: ers-arrive-logo 0.6s cubic-bezier(0.5, 0, 0.75, 0) 0.2s forwards;
  }

  @keyframes ers-arrive {
    to {
      clip-path: circle(0 at 50% 50%);
    }
  }

  @keyframes ers-arrive-logo {
    to {
      opacity: 0;
      transform: scale(0.4) rotate(-12deg);
    }
  }
</style>

  rel="stylesheet"
  as="style"
